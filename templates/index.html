<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Image Generation Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #logs {
            margin-top: 20px;
            border: 1px solid #ddd;
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .log {
            margin-bottom: 10px;
        }
        .image {
            max-width: 200px;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>WebSocket Image Generation Test</h1>

    <form id="websocketForm">
        <label>
            Wallet Address:
            <input type="text" id="walletAddress" value="your-wallet-address" required>
        </label>
        <br><br>
        <label>
            Prompt:
            <input type="text" id="prompt" value="A lighthouse on a cliff" required>
        </label>
        <br><br>
        <label>
            Style:
            <input type="text" id="style" value="">
        </label>
        <br><br>
        <label>
            Number of Images:
            <input type="number" id="numImages" value="3" min="1" required>
        </label>
        <br><br>
        <button type="submit">Start Generation</button>
    </form>

    <div id="logs"></div>

    <script>
        const form = document.getElementById("websocketForm");
        const logsDiv = document.getElementById("logs");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const walletAddress = document.getElementById("walletAddress").value;
            const prompt = document.getElementById("prompt").value;
            const style = document.getElementById("style").value;
            const numImages = parseInt(document.getElementById("numImages").value);

            const ws = new WebSocket("wss://nftproduction.fry.market/ws");

            ws.onopen = () => {
                logsDiv.innerHTML += `<div class="log">WebSocket connected. Sending data...</div>`;
                ws.send(JSON.stringify({
                    wallet_address: walletAddress,
                    prompt: prompt,
                    style: style,
                    num_images: numImages
                }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === "image") {
                    logsDiv.innerHTML += `
                        <div class="log">
                            <strong>Image URL:</strong> <a href="${data.data}" target="_blank">${data.data}</a>
                            <img src="${data.data}" class="image" />
                        </div>`;
                } else if (data.type === "metadata") {
                    logsDiv.innerHTML += `
                        <div class="log">
                            <strong>Metadata:</strong> <pre>${JSON.stringify(data.data, null, 2)}</pre>
                        </div>`;
                } else if (data.error) {
                    logsDiv.innerHTML += `<div class="log error"><strong>Error:</strong> ${data.error}</div>`;
                }
            };

            ws.onclose = () => {
                logsDiv.innerHTML += `<div class="log">WebSocket disconnected.</div>`;
            };

            ws.onerror = (error) => {
                logsDiv.innerHTML += `<div class="log error"><strong>Error:</strong> ${error.message}</div>`;
            };
        });
    </script>
</body>
</html>
