name: Deploy fry-foundation to Production server

on:
  push:
    branches:
      - main

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code using SSH
        uses: actions/checkout@v4
        with:
          repository: Fry-Foundation/fry-market-backend
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Install dependencies for deployment
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Create .ssh directory and add GitHub.com to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

  test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Run tests
        run: |
          echo "Running tests..."
          if [ -f "test_cases.py" ]; then
            python test_cases.py
          else
            echo "No test cases file found"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: test
    env:
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      HOST_IP: ${{ secrets.PRODUCTION_HOST_IP }}
      TARGET_DIR: '/root/production_Env/fry-network-python'
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Copy SSH private key and deploy
        run: |
          # Create a temp private key file on runner
          echo "$SSH_PRIVATE_KEY" > ./deploy_key
          chmod 600 ./deploy_key

          # Copy private key to server
          scp -o StrictHostKeyChecking=no -i ./deploy_key ./deploy_key $SSH_USERNAME@$HOST_IP:~/.ssh/fry_backend

          ssh -o StrictHostKeyChecking=no $SSH_USERNAME@$HOST_IP << 'EOF'
            set -e
            echo "Setting permissions for deploy key"
            chmod 600 ~/.ssh/fry_backend

            echo "Creating SSH config for GitHub"
            cat > ~/.ssh/config <<EOC
Host github.com
  HostName github.com
  User git
  IdentityFile ~/.ssh/fry_backend
  IdentitiesOnly yes
EOC
            chmod 600 ~/.ssh/config

            echo "Adding GitHub to known_hosts"
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts

            echo "Starting deployment..."

            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "Cloning repository..."
              rm -rf "$TARGET_DIR"
              mkdir -p "$TARGET_DIR"
              git clone git@github.com:Fry-Foundation/fry-market-backend.git "$TARGET_DIR"
            else
              echo "Fetching latest changes..."
              git -C "$TARGET_DIR" remote set-url origin git@github.com:Fry-Foundation/fry-market-backend.git
              git -C "$TARGET_DIR" fetch origin main
              git -C "$TARGET_DIR" reset --hard origin/main
            fi

            echo "Files in $TARGET_DIR:"
            ls -la "$TARGET_DIR"

            if [ ! -d "$TARGET_DIR/myenv" ]; then
              echo "Creating virtual environment..."
              python3.11 -m venv "$TARGET_DIR/myenv"
            fi
            source "$TARGET_DIR/myenv/bin/activate"

            if [ -f "$TARGET_DIR/requirements.txt" ]; then
              pip install --upgrade pip
              pip install -r "$TARGET_DIR/requirements.txt"
            else
              echo "No requirements.txt found"
              exit 1
            fi

            pip cache purge

            sudo systemctl daemon-reload
            sudo systemctl restart fry-backend.service
            sudo systemctl status fry-backend.service
          EOF

          rm -f ./deploy_key
        shell: bash

  nginx-config:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Configure and Restart Nginx
        run: |
          sudo apt install nginx -y
          sudo nginx -t
          sudo systemctl restart nginx
          sudo systemctl status nginx

  notify:
    runs-on: ubuntu-latest
    needs: nginx-config
    if: success()
    steps:
      - name: Notify Success
        run: |
          echo "🎉 Production deployment was successful! 🚀"
          echo "The latest changes have been deployed to production, and Nginx has been reconfigured."
