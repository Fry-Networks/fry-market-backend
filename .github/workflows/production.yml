name: Deploy to Production Server

on:
  push:
    branches:
      - main  # Trigger deployment on pushes to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up SSH for deployment
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST_IP }} >> ~/.ssh/known_hosts

      # Step 3: Deploy to Production Server
      - name: Deploy to Production Server
        env:
          TARGET_DIR: "/root/production_Env/fry-market-backend"  # Change to your target directory
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.PRODUCTION_HOST_IP }} <<EOF
            set -e
            echo "Starting deployment on production server"

            # Navigate to the target directory
            cd "$TARGET_DIR" || { echo "Directory not found: $TARGET_DIR"; exit 1; }

            # Pull the latest code from the repository
            git pull origin main || { echo "Git pull failed"; exit 1; }

            # Ensure virtual environment exists and activate it
            if [ ! -d "venv" ]; then
              python3.11 -m venv venv
            fi
            source venv/bin/activate

            # Install/update dependencies
            if [ -f "requirements.txt" ]; then
              echo "Installing dependencies from requirements.txt"
              pip install --upgrade pip
              pip install -r requirements.txt
            else
              echo "No requirements.txt file found"; exit 1;
            fi

            # Clean up pip cache
            pip cache purge

            # Restart the application service
            sudo systemctl daemon-reload
            sudo systemctl restart fry-foundation-production.service
            sudo systemctl status fry-foundation-production.service
          EOF

      # Step 4: Verify Nginx Configuration (Optional)
      - name: Verify Nginx Configuration
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.PRODUCTION_HOST_IP }} <<EOF
            sudo nginx -t
            sudo systemctl status nginx || true
            sudo systemctl restart nginx
          EOF
