name: Deploy fry-foundation to Production server

on:
  push:
    branches:
      - main  

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.6.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Install dependencies for deployment
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          
      - name: Add GitHub to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

  test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Run tests
        run: |
          echo "Running tests..."
          if [ -f "test_cases.py" ]; then
            python test_cases.py
          else
            echo "No test cases file found"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy to Server
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.PRODUCTION_SSH_PASSWORD }}
          HOST_IP: ${{ secrets.PRODUCTION_HOST_IP }}
          TARGET_DIR: '/root/production_Env/fry-network-python'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H $HOST_IP >> ~/.ssh/known_hosts
          
          sshpass -p "$SSH_PASSWORD" ssh -t -o StrictHostKeyChecking=no $SSH_USERNAME@$HOST_IP << EOF
            set -e
            echo "Deploying to production server"
            cd "$TARGET_DIR" || { echo "Directory not found: $TARGET_DIR"; exit 1; }
            
            echo "Listing files in $TARGET_DIR:"
            ls -la
            
            git config --global --add safe.directory "$TARGET_DIR"
            
            # Pull the latest code
            git pull origin main
            
            if [ ! -d "myenv" ]; then
              python3.11 -m venv myenv
            fi
            source myenv/bin/activate

            echo "Checking for requirements file..."
            if [ -f "requirements.txt" ]; then
              pip install --upgrade pip
              pip install -r "requirements.txt"
            else
              echo "No requirements file found"
              exit 1
            fi
            
            pip cache purge
            
            sudo systemctl daemon-reload
            sudo systemctl restart fry-foundation-production.service 
            sudo systemctl status fry-foundation-production.service 
          EOF
        shell: bash

  nginx-config:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Configure and Restart Nginx
        run: |
          sudo apt install nginx -y
          sudo nginx -t
          sudo systemctl restart nginx
          sudo systemctl status nginx

  notify:
    runs-on: ubuntu-latest
    needs: nginx-config
    if: success()
    steps:
      - name: Notify Success
        run: |
          echo "🎉 Production deployment was successful! 🚀"
          echo "The latest changes have been deployed to production, and Nginx has been reconfigured."
